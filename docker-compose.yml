services:
  pdfextractor:
    container_name: pdfextractor
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MAX_UPLOAD_MB: 50
      JSON_BODY_LIMIT_MB: 30
      APP_VERSION: ${APP_VERSION:-2.6.0}
    ports:
      # Caddy installed on the host proxies requests to this local port.
      - "3000"
    networks:
      - ssl-reverse-proxy

networks:
  ssl-reverse-proxy:
    external: true
