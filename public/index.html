<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Table Extractor</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}main{max-width:1450px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:20px;box-shadow:0 5px 20px #18243a0b}h1{margin:0 0 6px}p{color:#566176}.upload{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{border-radius:9px;padding:10px 14px;font-weight:700}button{border:0;background:#1f4e78;color:#fff;cursor:pointer}button.secondary{background:#eef3f8;color:#1f4e78}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;margin:16px 0}.stat{padding:14px;border-radius:10px;background:#f6f9fc;border:1px solid #e6ebf2}.stat label{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}.stats[hidden]{display:none}.stat b{display:block;font-size:21px;margin-top:4px}.table-wrap{overflow:auto;max-height:68vh;border:1px solid #e2e8f0;border-radius:10px}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}th,td{border-bottom:1px solid #e8edf3;padding:8px 10px;vertical-align:top;max-width:600px}th{position:sticky;top:0;background:#1f4e78;color:#fff;text-align:left}#status{margin:12px 0;font-weight:600}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab{background:#e8eef5;color:#1f4e78}.tab.active{background:#1f4e78;color:#fff}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main><div class="card">
<h1>PDF Table Extractor</h1><p>Estrae dati da PDF nativi con tabelle. Riconosce automaticamente <b>computi metrici</b>, <b>elenchi prezzi PriMus</b> e dispone di una modalità <b>tabella generica</b> basata sulle coordinate del PDF.</p>
<div class="upload"><input id="file" type="file" accept="application/pdf,.pdf"><select id="mode"><option value="auto">Riconoscimento automatico</option><option value="computo">Computo metrico</option><option value="elenco_prezzi">Elenco prezzi</option><option value="generic_table">Tabella generica</option></select><button id="extract">Estrai</button><button id="xlsx" class="secondary" disabled>Excel</button><button id="csv" class="secondary" disabled>CSV</button><button id="json" class="secondary" disabled>JSON</button></div>
<div id="status"></div><div class="stats" id="stats" hidden><div class="stat">Tipo<b id="sType">-</b></div><div class="stat">Pagine<b id="sPages">-</b></div><div class="stat">Record<b id="sRows">-</b></div><div class="stat">Totale<b id="sTotal">-</b></div><div class="stat">Incompleti<b id="sIncomplete">-</b><label><input id="onlyIncomplete" type="checkbox" aria-controls="table" disabled>Solo INCOMPLETO</label></div></div><div class="tabs" id="tabs"></div><div class="table-wrap" id="wrap" hidden><table id="table"></table></div>
</div></main><script>
let data=null, currentTable=0; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); const euro=n=>n==null?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
$('extract').onclick=async()=>{const f=$('file').files[0];if(!f)return $('status').textContent='Seleziona un PDF.';$('status').textContent='Estrazione in corso…';$('extract').disabled=true;try{const fd=new FormData();fd.append('pdf',f);fd.append('mode',$('mode').value);const r=await fetch('/api/extract',{method:'POST',body:fd});data=await r.json();if(!r.ok)throw new Error(data.error||'Errore');render();$('status').textContent=`${data.filename} — ${data.label}${data.warnings?.length?' — '+data.warnings.join(' '):''}`;['xlsx','csv','json'].forEach(id=>$(id).disabled=false)}catch(e){$('status').textContent=e.message}finally{$('extract').disabled=false}};
const isIncomplete=record=>record.controllo==='INCOMPLETO';
$('onlyIncomplete').onchange=()=>renderRecords();
function render(){ $('onlyIncomplete').checked=false;$('onlyIncomplete').disabled=data.type==='generic_table'||!(data.columns||[]).some(([key])=>key==='controllo');$('sIncomplete').textContent=data.type==='generic_table'?'—':(data.records||[]).filter(isIncomplete).length;$('stats').hidden=false;$('wrap').hidden=false;$('sType').textContent=data.label;$('sPages').textContent=data.pages;$('sRows').textContent=data.records?.length??0;$('sTotal').textContent=data.totaleEstratto==null?'—':euro(data.totaleEstratto); if(data.type==='generic_table') renderGeneric(0); else renderRecords(); }
function renderRecords(){ $('tabs').innerHTML='';const cols=data.columns||[];const records=(data.records||[]).filter(r=>!$('onlyIncomplete').checked||isIncomplete(r));$('table').innerHTML='<thead><tr>'+cols.map(c=>`<th>${esc(c[1])}</th>`).join('')+'</tr></thead><tbody>'+records.map(r=>'<tr>'+cols.map(([k])=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join('')+(records.length?'':`<tr><td colspan="${Math.max(cols.length,1)}">${$('onlyIncomplete').checked?'Nessuna riga con controllo INCOMPLETO.':'Nessun record.'}</td></tr>`)+'</tbody>'; }
function renderGeneric(i){currentTable=i;const tables=data.tables||[];$('tabs').innerHTML=tables.map((t,j)=>`<button class="tab ${j===i?'active':''}" onclick="renderGeneric(${j})">Pag. ${t.page}</button>`).join('');const t=tables[i];if(!t){$('table').innerHTML='';return}const max=Math.max(...t.rows.map(r=>r.length));$('table').innerHTML='<thead><tr>'+Array.from({length:max},(_,k)=>`<th>Colonna ${k+1}</th>`).join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+Array.from({length:max},(_,k)=>`<td>${esc(r[k]||'')}</td>`).join('')+'</tr>').join('')+'</tbody>';}
async function exp(ep,name){const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('Export fallito');download(await r.blob(),name)}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('xlsx').onclick=()=>exp('/api/export/xlsx','estrazione.xlsx');$('csv').onclick=()=>exp('/api/export/csv','estrazione.csv');$('json').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'estrazione.json');
</script></body></html>
